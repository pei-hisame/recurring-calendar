<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f2"><meta name="description" content="不需登入、在本機儲存的週期行事曆">
<title>週期行事曆</title>
<style>
:root{--bg:#f7f7f2;--paper:#fff;--ink:#222720;--muted:#72786e;--line:#e5e7df;--accent:#2c6e62;--accent2:#dcece5;--shadow:0 8px 30px #263b2b0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:800;text-transform:uppercase}.title{font-size:clamp(26px,4vw,38px);letter-spacing:-.04em;margin:5px 0}.sub{color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;color:var(--ink);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#a33;border-color:#f0d9d9}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}.panel,.calendar-panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;font-size:17px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3da;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color-row{display:flex;gap:9px;flex-wrap:wrap}.color-choice{width:27px;height:27px;border:2px solid #fff;outline:1px solid #ddd;border-radius:50%;padding:0}.color-choice.selected{outline:2px solid var(--ink)}.full{width:100%}.event-list{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.event-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1ed}.dot{width:11px;height:11px;border-radius:4px;flex:none}.event-meta{min-width:0;flex:1}.event-name{font-weight:700;overflow-wrap:anywhere}.event-detail{font-size:12px;color:var(--muted);margin-top:3px}.small-actions{display:flex;gap:5px}.icon-btn{border:0;background:#f2f4ef;border-radius:8px;padding:6px 8px;color:#465047}.calendar-panel{padding:20px;min-width:0}.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.month-label{font-size:23px;font-weight:800;letter-spacing:-.04em}.nav{display:flex;gap:6px}.nav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}.view-toggle{display:flex;gap:4px;background:#f0f2eb;padding:4px;border-radius:11px;margin-bottom:15px;width:max-content}.view-toggle button{border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted)}.view-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0000000b}.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{text-align:center;font-size:12px;font-weight:750;color:var(--muted);padding:9px 0}.day{min-height:112px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:7px 5px;min-width:0}.day:nth-child(7n){border-right:0}.day.outside{background:#fafbf8;color:#aeb3a8}.day.today .day-num{background:var(--accent);color:white}.day-num{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:750;margin-bottom:5px}.event-chip{display:block;width:100%;border:0;border-radius:6px;text-align:left;padding:4px 5px;margin:3px 0;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#24332c}.event-chip.done{text-decoration:line-through;opacity:.55}.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}.year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.year-month{border:1px solid var(--line);border-radius:9px;padding:6px;min-width:0}.year-month-title{font-weight:800;font-size:12px;margin-bottom:4px}.year-weekdays,.year-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}.year-weekdays span{text-align:center;color:var(--muted);font-size:8px;padding:2px 0}.year-date{position:relative;border:0;background:transparent;border-radius:3px;min-width:0;padding:1px 0;font-size:9px;color:var(--ink);aspect-ratio:1;display:flex;align-items:center;justify-content:center}.year-date.has-events{background:#f0f3ee;font-weight:800}.year-date.today{background:var(--accent);color:#fff}.year-date .year-dots{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;gap:1px}.year-date .year-dots i{display:block;width:3px;height:3px;border-radius:50%}.year-date.today .year-dots i{outline:1px solid #fff}.year-date.blank{pointer-events:none}.hint{background:#f3f7f2;border-radius:12px;padding:11px 12px;color:#56645a;font-size:12px;line-height:1.55;margin-top:14px}.footer{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}.modal-backdrop{position:fixed;inset:0;background:#17251fcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal-backdrop.show{display:flex}.modal{width:min(460px,100%);background:white;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253c32;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:10;font-size:14px}.toast.show{display:block}.hidden{display:none!important}
@media(max-width:800px){.year-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.year-month{padding:4px}.year-month-title{font-size:10px;margin-bottom:3px}.year-weekdays span{font-size:7px;padding:1px 0}.year-date{font-size:8px;padding:0}.app{padding:18px 10px 30px}.top{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.calendar-panel{padding:12px}.panel{padding:16px}.day{min-height:86px;padding:5px 3px}.day-num{width:23px;height:23px}.event-chip{font-size:10px;padding:4px 3px}.month-label{font-size:21px}.weekdays div{font-size:11px}.cal-head{align-items:flex-start}.actions .btn{padding:9px 11px}}
@media(max-width:390px){.year-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.year-month{padding:3px}.year-month-title{font-size:9px}.year-weekdays span{font-size:6px}.year-date{font-size:7px}.day{min-height:74px}.event-chip{font-size:9px}.view-toggle button{padding:7px 9px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="eyebrow">PERSONAL PLANNER</div><h1 class="title">週期行事曆</h1><div class="sub">設定一次，讓重複任務自動排進日曆。</div></div><div class="actions"><button class="btn" id="exportBtn">匯出備份</button><button class="btn" id="importBtn">匯入備份</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div></header>
<div class="layout">
<aside class="panel"><h2 class="section-title" id="formTitle">新增週期事件 <span>＋</span></h2>
<form id="eventForm">
<div class="field"><label for="eventName">事件名稱</label><input id="eventName" maxlength="80" placeholder="例如：整理資料" required></div>
<div class="field"><label for="startDate">首次執行日期</label><input id="startDate" type="date" required></div>
<div class="two"><div class="field"><label for="interval">每隔幾週</label><select id="interval"><option value="1">每 1 週</option><option value="2">每 2 週</option><option value="3" selected>每 3 週</option><option value="4">每 4 週</option><option value="5">每 5 週</option><option value="6">每 6 週</option><option value="8">每 8 週</option><option value="12">每 12 週</option><option value="custom">自訂…</option></select></div><div class="field hidden" id="customIntervalWrap"><label for="customInterval">週數</label><input id="customInterval" type="number" min="1" max="104" value="3"></div><div class="field"><label for="endMode">排程期限</label><select id="endMode"><option value="year">未來一年</option><option value="forever">持續重複</option></select></div></div>
<div class="field"><label>事件顏色</label><div class="color-row" id="colorChoices"><button type="button" class="color-choice selected" data-color="#d7eee5" style="background:#d7eee5" aria-label="薄荷綠"></button><button type="button" class="color-choice" data-color="#dce8ff" style="background:#dce8ff" aria-label="藍色"></button><button type="button" class="color-choice" data-color="#f9dfb5" style="background:#f9dfb5" aria-label="橘色"></button><button type="button" class="color-choice" data-color="#eadfff" style="background:#eadfff" aria-label="紫色"></button><button type="button" class="color-choice" data-color="#f7d9dc" style="background:#f7d9dc" aria-label="粉紅色"></button><button type="button" class="color-choice" data-color="#e7e9a9" style="background:#e7e9a9" aria-label="黃色"></button></div></div>
<div class="field"><label for="eventNote">備註（選填）</label><textarea id="eventNote" rows="2" maxlength="300" placeholder="補充說明或待辦事項"></textarea></div>
<button class="btn primary full" type="submit" id="saveEventBtn">新增事件並排程</button><button class="btn full hidden" type="button" id="cancelEditBtn" style="margin-top:8px">取消編輯</button>
</form><div class="event-list"><h3 class="section-title">我的事件 <span id="eventCount">0</span></h3><div id="eventList"><div class="empty">還沒有事件，新增一個試試。</div></div></div>
<div class="hint">🔒 資料只存在這個瀏覽器。建議定期按「匯出備份」，避免清除網站資料後遺失。</div></aside>
<main class="calendar-panel"><div class="cal-head"><div><div class="eyebrow" id="rangeLabel">CALENDAR</div><div class="month-label" id="monthLabel"></div></div><div class="nav"><button id="prevBtn" aria-label="上一個">←</button><button id="todayBtn">今天</button><button id="nextBtn" aria-label="下一個">→</button></div></div>
<div class="view-toggle"><button class="active" data-view="month">月檢視</button><button data-view="year">年檢視</button></div>
<div id="calendar"></div><div class="footer">點選日曆中的事件，可標記完成或查看備註。週期日期會依「首次執行日＋間隔週數」計算。</div></main>
</div></div>
<div class="modal-backdrop" id="eventModal"><div class="modal"><h2 id="modalTitle">事件</h2><div id="modalBody"></div><div class="actions" style="margin-top:18px"><button class="btn primary" id="toggleDoneBtn">標記完成</button><button class="btn" id="modalEditBtn">編輯事件</button><button class="btn" id="modalCloseBtn">關閉</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);const STORAGE='recurring-calendar-v1';const COLORS=['#d7eee5','#dce8ff','#f9dfb5','#eadfff','#f7d9dc','#e7e9a9'];
let events=[],done={},view='month',cursor=new Date(),editingId=null,selectedColor=COLORS[0],modalOccurrence=null;
cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayDiff=(a,b)=>Math.round((parse(iso(a))-parse(iso(b)))/86400000);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({events,done}));}catch(e){toast('無法儲存，請檢查瀏覽器儲存空間。')}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');events=Array.isArray(x.events)?x.events:[];done=x.done&&typeof x.done==='object'?x.done:{}}catch{events=[];done={}}}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function intervalOf(e){return Math.max(1,Number(e.interval)||1)}
function occurrences(e,from,to){let start=parse(e.start);if(e.endMode!=='forever'){to=new Date(Math.min(to.getTime(),addDays(start,365).getTime()))}let diff=dayDiff(from,start);let k=Math.max(0,Math.ceil(diff/(intervalOf(e)*7)));let out=[];for(let d=addDays(start,k*intervalOf(e)*7);d<=to;d=addDays(d,intervalOf(e)*7)){if(d>=from)out.push({date:iso(d),event:e})}return out}
function allBetween(from,to){return events.flatMap(e=>occurrences(e,from,to)).sort((a,b)=>a.date.localeCompare(b.date)||a.event.name.localeCompare(b.event.name))}
function resetForm(){editingId=null;$('eventForm').reset();$('startDate').value=iso(new Date());$('interval').value='3';$('endMode').value='year';$('eventNote').value='';selectedColor=COLORS[0];updateColors();$('formTitle').innerHTML='新增週期事件 <span>＋</span>';$('saveEventBtn').textContent='新增事件並排程';$('cancelEditBtn').classList.add('hidden');$('customIntervalWrap').classList.add('hidden')}
function updateColors(){document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('selected',b.dataset.color===selectedColor))}
$('colorChoices').addEventListener('click',e=>{let b=e.target.closest('[data-color]');if(b){selectedColor=b.dataset.color;updateColors()}});
$('interval').addEventListener('change',()=>{$('customIntervalWrap').classList.toggle('hidden',$('interval').value!=='custom')});
$('eventForm').addEventListener('submit',e=>{e.preventDefault();let n=$('eventName').value.trim(),start=$('startDate').value,iv=$('interval').value==='custom'?Number($('customInterval').value):Number($('interval').value);if(!n||!start||!Number.isInteger(iv)||iv<1||iv>104){toast('請檢查事件名稱、日期與週期。');return}let data={id:editingId||crypto.randomUUID?.()||String(Date.now()),name:n,start,interval:iv,endMode:$('endMode').value,color:selectedColor,note:$('eventNote').value.trim()};if(editingId){events=events.map(x=>x.id===editingId?data:x);toast('事件已更新。')}else{events.push(data);toast('事件已新增並排程。')}save();resetForm();render()});
$('cancelEditBtn').addEventListener('click',resetForm);
function editEvent(id){let e=events.find(x=>x.id===id);if(!e)return;editingId=id;$('eventName').value=e.name;$('startDate').value=e.start;$('interval').value=[1,2,3,4,5,6,8,12].includes(e.interval)?String(e.interval):'custom';$('customIntervalWrap').classList.toggle('hidden',$('interval').value!=='custom');$('customInterval').value=e.interval;$('endMode').value=e.endMode||'year';$('eventNote').value=e.note||'';selectedColor=e.color||COLORS[0];updateColors();$('formTitle').innerHTML='編輯週期事件 <span>✎</span>';$('saveEventBtn').textContent='儲存修改';$('cancelEditBtn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});$('eventModal').classList.remove('show')}
function deleteEvent(id){let e=events.find(x=>x.id===id);if(!e)return;if(!confirm(`確定刪除「${e.name}」？相關完成紀錄也會移除。`))return;events=events.filter(x=>x.id!==id);Object.keys(done).forEach(k=>{if(k.startsWith(id+'|'))delete done[k]});save();render();toast('事件已刪除。')}
function renderEvents(){ $('eventCount').textContent=events.length;let host=$('eventList');if(!events.length){host.innerHTML='<div class="empty">還沒有事件，新增一個試試。</div>';return}host.innerHTML=events.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<div class="event-item"><span class="dot" style="background:${e.color}"></span><div class="event-meta"><div class="event-name">${safe(e.name)}</div><div class="event-detail">每 ${e.interval} 週・${safe(e.start)} 起</div></div><div class="small-actions"><button class="icon-btn" data-edit="${e.id}" title="編輯">✎</button><button class="icon-btn" data-delete="${e.id}" title="刪除">×</button></div></div>`).join('');host.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEvent(b.dataset.edit));host.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteEvent(b.dataset.delete))}
const monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
function openOccurrence(occ){modalOccurrence=occ;let key=occ.event.id+'|'+occ.date;let isDone=!!done[key];$('modalTitle').textContent=occ.event.name;$('modalBody').innerHTML=`<p><b>日期：</b>${occ.date}</p><p><b>週期：</b>每 ${occ.event.interval} 週一次</p><p><b>狀態：</b>${isDone?'已完成':'未完成'}</p>${occ.event.note?`<p><b>備註：</b>${safe(occ.event.note)}</p>`:''}`;$('toggleDoneBtn').textContent=isDone?'取消完成':'標記完成';$('eventModal').classList.add('show')}
$('toggleDoneBtn').onclick=()=>{if(!modalOccurrence)return;let k=modalOccurrence.event.id+'|'+modalOccurrence.date;if(done[k])delete done[k];else done[k]=true;save();$('eventModal').classList.remove('show');render()};$('modalEditBtn').onclick=()=>modalOccurrence&&editEvent(modalOccurrence.event.id);$('modalCloseBtn').onclick=()=>$('eventModal').classList.remove('show');$('eventModal').addEventListener('click',e=>{if(e.target===$('eventModal'))$('eventModal').classList.remove('show')});
function renderMonth(){let first=new Date(cursor.getFullYear(),cursor.getMonth(),1,12),start=addDays(first,-((first.getDay()+6)%7)),end=addDays(start,41);$('monthLabel').textContent=`${cursor.getFullYear()} 年 ${monthNames[cursor.getMonth()]}`;$('rangeLabel').textContent='MONTH VIEW';let occ=allBetween(start,end),by={};occ.forEach(o=>(by[o.date]??=[]).push(o));let html='<div class="weekdays">'+['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';let today=iso(new Date());for(let i=0;i<42;i++){let d=addDays(start,i),key=iso(d),items=by[key]||[];html+=`<div class="day ${d.getMonth()!==cursor.getMonth()?'outside':''} ${key===today?'today':''}"><div class="day-num">${d.getDate()}</div>${items.slice(0,3).map(o=>`<button class="event-chip ${done[o.event.id+'|'+o.date]?'done':''}" data-event="${o.event.id}" data-date="${o.date}" style="background:${o.event.color}" title="${safe(o.event.name)}">${safe(o.event.name)}</button>`).join('')}${items.length>3?`<div style="font-size:10px;color:#777">＋${items.length-3} 個</div>`:''}</div>`}html+='</div>';$('calendar').innerHTML=html;bindCalendar()}
function renderYear(){const startMonth=new Date(cursor.getFullYear(),cursor.getMonth(),1,12),endMonth=new Date(cursor.getFullYear(),cursor.getMonth()+12,0,12);$('monthLabel').textContent=`${startMonth.getFullYear()} 年 ${monthNames[startMonth.getMonth()]}－${endMonth.getFullYear()} 年 ${monthNames[endMonth.getMonth()]}`;$('rangeLabel').textContent='NEXT 12 MONTHS';const from=startMonth,to=endMonth;let occ=allBetween(from,to),by={};occ.forEach(o=>(by[o.date]??=[]).push(o));let today=iso(new Date()),html='<div class="year-grid">';for(let idx=0;idx<12;idx++){let monthDate=new Date(startMonth.getFullYear(),startMonth.getMonth()+idx,1,12),year=monthDate.getFullYear(),m=monthDate.getMonth(),first=new Date(year,m,1,12),offset=(first.getDay()+6)%7,days=new Date(year,m+1,0).getDate();html+=`<section class="year-month"><div class="year-month-title">${year}年 ${monthNames[m]}</div><div class="year-weekdays">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="year-days">`;for(let i=0;i<offset;i++)html+='<span class="year-date blank"></span>';for(let d=1;d<=days;d++){let key=iso(new Date(year,m,d,12)),items=by[key]||[],names=items.map(o=>o.event.name).join('、');html+=`<button class="year-date ${items.length?'has-events':''} ${key===today?'today':''}" data-year-date="${key}" title="${safe(names||key)}">${d}${items.length?`<span class="year-dots">${items.slice(0,4).map(o=>`<i style="background:${o.event.color}"></i>`).join('')}</span>`:''}</button>`}html+='</div></section>'}html+='</div>';$('calendar').innerHTML=html;$('calendar').querySelectorAll('[data-year-date]').forEach(b=>b.addEventListener('click',()=>{let items=by[b.dataset.yearDate]||[];if(items.length)openOccurrence(items[0]);else toast('這一天沒有排定事件。')}))}
function bindCalendar(){document.querySelectorAll('#calendar [data-event]').forEach(b=>b.addEventListener('click',()=>{let ev=events.find(e=>e.id===b.dataset.event);if(ev)openOccurrence({event:ev,date:b.dataset.date})}))}
function render(){renderEvents();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='month')renderMonth();else renderYear()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('prevBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+(view==='month'?-1:-12),1);render()};$('nextBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+(view==='month'?1:12),1);render()};$('todayBtn').onclick=()=>{let n=new Date();cursor=new Date(n.getFullYear(),n.getMonth(),1);render()};
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),events,done},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='週期行事曆備份.json';a.click();URL.revokeObjectURL(a.href);toast('已匯出備份檔。')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.events)||!x.done||typeof x.done!=='object')throw Error();if(!confirm('匯入備份會取代目前的事件與完成紀錄，確定繼續？'))return;events=x.events;done=x.done;save();render();toast('備份匯入成功。')}catch{alert('檔案格式不正確，無法匯入。')}finally{e.target.value=''}};
load();$('startDate').value=iso(new Date());render();
})();
</script>
</body></html>
